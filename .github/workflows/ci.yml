name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check .
      - name: Check formatting for changed Python files
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="origin/$GITHUB_BASE_REF"
          else
            base="$(git rev-parse HEAD~1)"
          fi
          mapfile -t files < <(git diff --name-only "$base...HEAD" -- '*.py')
          if ((${#files[@]})); then
            uv run ruff format --check "${files[@]}"
          else
            echo "No changed Python files."
          fi
      - run: uv run pytest -q -rs --junitxml=pytest-results.xml
      - run: uv run python scripts/check_coverage_skips.py pytest-results.xml

  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="origin/$GITHUB_BASE_REF"
          else
            base="$(git rev-parse HEAD~1)"
          fi
          if git diff --name-only "$base...HEAD" -- src tests Dockerfile compose.yaml pyproject.toml uv.lock docker THIRD_PARTY_NOTICES.md | grep -q .; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.changes.outputs.build == 'true'
      - uses: docker/build-push-action@v6
        if: steps.changes.outputs.build == 'true'
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
