name: Feature request
description: Suggest a capability for the self-hosted converter.
title: "feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Do not include private documents, personal data, credentials, or secrets. Do not use this form to report a security vulnerability; use private reporting instead."
  - type: input
    id: version
    attributes:
      label: App version or image tag
      description: Enter the version you use, or say that you are not using the app yet.
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Deployment profile and host architecture
      placeholder: "e.g. Docker Compose, linux/amd64"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed workflow
      description: Explain what you want to do and how you expect the tool to behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
