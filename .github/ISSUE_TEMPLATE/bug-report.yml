name: Bug report
description: Report a reproducible problem with a shipped tool.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not upload private documents, personal data, passwords, tokens, or secrets. For security vulnerabilities, use the private reporting link above instead of this public form."
  - type: input
    id: version
    attributes:
      label: App version or image tag
      placeholder: "e.g. v1.2.3 or latest"
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Deployment profile
      placeholder: "e.g. Docker Compose"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host OS and architecture
      placeholder: "e.g. Debian 13, linux/amd64"
    validations:
      required: true
  - type: input
    id: operation
    attributes:
      label: Operation and browser
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction steps
      description: Include expected and actual behavior. Never attach source documents or secrets.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error or logs
    validations:
      required: false
