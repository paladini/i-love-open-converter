<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OCR PDF · I Love Open Converter</title><link rel="stylesheet" href="/static/css/app.css"><script defer src="/static/js/pdf-ocr.js"></script></head><body>
<header class="site-header"><a class="brand" href="/">I Love <strong>Open Converter</strong></a><label class="language-picker"><span class="sr-only">Idioma / Language</span><select id="language"><option value="en">EN</option><option value="pt-BR">PT</option></select></label></header>
<main class="pdf-tool"><nav class="breadcrumbs"><a href="/" data-pt="Todas as ferramentas" data-en="All tools">Todas as ferramentas</a></nav><section class="pdf-tool-heading"><span class="pdf-tool-icon">OCR</span><h1 data-pt="OCR PDF" data-en="OCR PDF">OCR PDF</h1><p data-pt="Crie uma camada de texto pesquisável em PDFs digitalizados." data-en="Add a searchable text layer to scanned PDFs.">Crie uma camada de texto pesquisável em PDFs digitalizados.</p></section>
<section class="pdf-tool-card"><form id="form"><label class="pdf-upload" for="file"><strong data-pt="Selecionar arquivo PDF" data-en="Select PDF file">Selecionar arquivo PDF</strong><input id="file" type="file" accept="application/pdf,.pdf" required><span data-pt="Um PDF · até 20 páginas" data-en="One PDF · up to 20 pages">Um PDF · até 20 páginas</span></label><p id="filename" class="picked-file"></p>
<label class="ocr-language" for="ocr-language"><span data-pt="Idioma do documento" data-en="Document language">Idioma do documento</span><select id="ocr-language"><option value="por+eng" data-pt="Português + English" data-en="Português + English">Português + English</option><option value="por" data-pt="Português" data-en="Português">Português</option><option value="eng" data-pt="English" data-en="English">English</option></select></label>
<p class="ocr-disclosure" data-pt="O processamento é local. A precisão depende da qualidade da digitalização; revise o texto reconhecido." data-en="Processing is local. Accuracy depends on scan quality; review the recognized text.">O processamento é local. A precisão depende da qualidade da digitalização; revise o texto reconhecido.</p>
<button id="submit" class="primary-button" type="submit" data-pt="Criar PDF pesquisável" data-en="Create searchable PDF" disabled>Criar PDF pesquisável</button></form><p id="message" role="status" aria-live="polite"></p><a id="download" class="download-button" hidden data-pt="Baixar PDF pesquisável" data-en="Download searchable PDF">Baixar PDF pesquisável</a></section></main></body></html>
