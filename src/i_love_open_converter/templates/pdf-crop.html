<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crop PDF · I Love Open Converter</title><link rel="stylesheet" href="/static/css/app.css"><script defer src="/static/js/pdf-crop.js"></script></head>
<body><header class="site-header"><a class="brand" href="/">I Love <strong>Open Converter</strong></a><label class="language-picker"><span class="sr-only">Idioma / Language</span><select id="language"><option value="en">EN</option><option value="pt-BR">PT</option></select></label></header>
<main class="pdf-tool"><nav class="breadcrumbs"><a href="/" data-pt="Todas as ferramentas" data-en="All tools">Todas as ferramentas</a></nav><section class="pdf-tool-heading"><span class="pdf-tool-icon">PDF</span><h1 data-pt="Recortar PDF" data-en="Crop PDF">Recortar PDF</h1><p data-pt="Escolha a área visível e aplique às páginas desejadas." data-en="Choose the visible area and apply it to selected pages.">Escolha a área visível e aplique às páginas desejadas.</p></section>
<section class="pdf-tool-card"><label class="pdf-upload" for="file"><strong data-pt="Selecionar arquivo PDF" data-en="Select PDF file">Selecionar arquivo PDF</strong><input id="file" type="file" accept="application/pdf,.pdf"></label>
<form id="editor" hidden><p id="filename" class="picked-file"></p><div class="crop-navigation"><button type="button" id="previous" data-pt="Página anterior" data-en="Previous page">Página anterior</button><span id="page-label"></span><button type="button" id="next" data-pt="Próxima página" data-en="Next page">Próxima página</button></div>
<div class="crop-preview"><img id="preview" alt=""><div id="crop-selection" aria-hidden="true"></div></div>
<p data-pt="Ajuste os limites em porcentagem; a área destacada será mantida." data-en="Adjust the limits as percentages; the highlighted area will be kept.">Ajuste os limites em porcentagem; a área destacada será mantida.</p><div class="option-grid crop-inputs"><label><span data-pt="Esquerda (%)" data-en="Left (%)">Esquerda (%)</span><input id="left" type="number" min="0" max="99" value="0" required></label><label><span data-pt="Topo (%)" data-en="Top (%)">Topo (%)</span><input id="top" type="number" min="0" max="99" value="0" required></label><label><span data-pt="Direita (%)" data-en="Right (%)">Direita (%)</span><input id="right" type="number" min="1" max="100" value="100" required></label><label><span data-pt="Base (%)" data-en="Bottom (%)">Base (%)</span><input id="bottom" type="number" min="1" max="100" value="100" required></label><label class="wide-field"><span data-pt="Páginas (ex.: 1-3,5)" data-en="Pages (e.g. 1-3,5)">Páginas (ex.: 1-3,5)</span><input id="ranges" type="text" required></label></div><button id="submit" class="primary-button" type="submit" data-pt="Recortar PDF" data-en="Crop PDF">Recortar PDF</button></form><p id="message" role="status" aria-live="polite"></p><a id="download" class="download-button" hidden data-pt="Baixar PDF" data-en="Download PDF">Baixar PDF</a></section></main></body></html>
