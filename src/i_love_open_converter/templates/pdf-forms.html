<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PDF forms · I Love Open Converter</title><link rel="stylesheet" href="/static/css/app.css"><script defer src="/static/js/pdf-forms.js"></script></head><body><header class="site-header"><a class="brand" href="/">I Love <strong>Open Converter</strong></a><label class="language-picker"><span class="sr-only">Language</span><select id="language"><option value="pt-BR">PT</option><option value="en">EN</option></select></label></header><main class="pdf-tool"><nav class="breadcrumbs"><a href="/" data-pt="Todas as ferramentas" data-en="All tools">All tools</a></nav><section class="pdf-tool-heading"><span class="pdf-tool-icon">PDF</span><h1 data-pt="Formulários PDF" data-en="PDF forms">PDF forms</h1><p data-pt="Preencha formulários existentes ou crie novos campos no PDF." data-en="Fill existing forms or add new fields to a PDF.">Fill existing forms or add new fields to a PDF.</p></section><section class="pdf-tool-card"><label class="pdf-upload" for="file"><strong data-pt="Selecionar arquivo PDF" data-en="Select PDF file">Select PDF file</strong><input id="file" type="file" accept="application/pdf,.pdf"></label><p id="filename" class="picked-file"></p><div id="authoring" hidden><div class="form-author-tools"><label><span data-pt="Página" data-en="Page">Page</span><input id="page" type="number" min="1" value="1"></label><button id="previous" type="button" data-pt="Anterior" data-en="Previous">Previous</button><button id="next" type="button" data-pt="Próxima" data-en="Next">Next</button><label><span data-pt="Novo campo" data-en="New field">New field</span><select id="new-type"><option value="text" data-pt="Texto" data-en="Text">Text</option><option value="checkbox" data-pt="Caixa de seleção" data-en="Checkbox">Checkbox</option><option value="radio" data-pt="Múltipla escolha" data-en="Radio group">Radio group</option><option value="combo" data-pt="Lista suspensa" data-en="Dropdown">Dropdown</option><option value="list" data-pt="Lista" data-en="List">List</option></select></label><button id="suggest" type="button" data-pt="Sugerir campos localmente" data-en="Suggest fields locally">Suggest fields locally</button></div><p class="scan-disclosure" data-pt="Arraste sobre a página para adicionar um campo. Sugestões de OCR são locais e podem ser editadas antes de salvar." data-en="Drag on the page to add a field. OCR suggestions run locally and can be edited before saving.">Drag on the page to add a field. OCR suggestions run locally and can be edited before saving.</p><div class="form-preview-wrap"><div id="form-preview" class="form-preview"><img id="preview" alt="PDF page preview"><div id="overlay" class="form-preview-overlay"></div></div></div><div id="created-fields" class="form-fields"></div></div><form id="editor" hidden><h2 data-pt="Campos existentes" data-en="Existing fields">Existing fields</h2><div id="fields" class="form-fields"></div><button id="submit" class="primary-button" type="submit" data-pt="Salvar PDF preenchível" data-en="Save fillable PDF">Save fillable PDF</button></form><p id="message" role="status" aria-live="polite"></p><a id="download" class="download-button" hidden data-pt="Baixar PDF" data-en="Download PDF">Download PDF</a></section></main></body></html>
