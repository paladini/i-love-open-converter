<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% if action == 'protect' %}Proteger{% else %}Desbloquear{% endif %} PDF · I Love Open Converter</title><link rel="stylesheet" href="/static/css/app.css"><script defer src="/static/js/pdf-password.js"></script></head><body>
<header class="site-header"><a class="brand" href="/">I Love <strong>Open Converter</strong></a><label class="language-picker"><span class="sr-only">Idioma / Language</span><select id="language"><option value="pt-BR">PT</option><option value="en">EN</option></select></label></header>
<main class="pdf-tool" data-action="{{ action }}"><nav class="breadcrumbs"><a href="/" data-pt="Todas as ferramentas" data-en="All tools">Todas as ferramentas</a></nav><section class="pdf-tool-heading"><span class="pdf-tool-icon">PDF</span>{% if action == 'protect' %}<h1 data-pt="Proteger PDF" data-en="Protect PDF">Proteger PDF</h1><p data-pt="Crie uma senha para abrir seu PDF." data-en="Create a password to open your PDF.">Crie uma senha para abrir seu PDF.</p>{% else %}<h1 data-pt="Desbloquear PDF" data-en="Unlock PDF">Desbloquear PDF</h1><p data-pt="Informe a senha atual para remover a proteção." data-en="Enter the current password to remove protection.">Informe a senha atual para remover a proteção.</p>{% endif %}</section><section class="pdf-tool-card"><form id="form"><label class="pdf-upload" for="file"><strong data-pt="Selecionar arquivo PDF" data-en="Select PDF file">Selecionar arquivo PDF</strong><input id="file" type="file" accept="application/pdf,.pdf" required></label><p id="filename" class="picked-file"></p><div id="options" hidden><label class="image-upload-option"><span data-pt="Senha" data-en="Password">Senha</span><input id="password" type="password" autocomplete="{% if action == 'protect' %}new-password{% else %}current-password{% endif %}" required></label><p data-pt="Máximo de 40 bytes em UTF-8." data-en="Up to 40 UTF-8 bytes.">Máximo de 40 bytes em UTF-8.</p><button id="submit" class="primary-button" type="submit">{% if action == 'protect' %}Proteger PDF{% else %}Desbloquear PDF{% endif %}</button></div></form><p id="message" role="status" aria-live="polite"></p><a id="download" class="download-button" hidden data-pt="Baixar PDF" data-en="Download PDF">Baixar PDF</a></section></main></body></html>
