<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }} para PDF · I Love Open Converter</title><link rel="stylesheet" href="/static/css/app.css"><script defer src="/static/js/office-to-pdf.js"></script></head>
<body><header class="site-header"><a class="brand" href="/">I Love <strong>Open Converter</strong></a><label class="language-picker"><span class="sr-only">Idioma / Language</span><select id="language"><option value="pt-BR">PT</option><option value="en">EN</option></select></label></header>
<main class="pdf-tool"><nav class="breadcrumbs"><a href="/" data-pt="Todas as ferramentas" data-en="All tools">Todas as ferramentas</a></nav>
<section class="pdf-tool-heading"><span class="pdf-tool-icon">PDF</span><h1 data-pt="{{ title }} para PDF" data-en="{{ title }} to PDF">{{ title }} para PDF</h1><p data-pt="Converta seu documento em PDF no seu servidor." data-en="Convert your document to PDF on your server.">Converta seu documento em PDF no seu servidor.</p></section>
<section class="pdf-tool-card"><form id="office-form" data-family="{{ family }}"><label class="pdf-upload" for="office-file"><strong data-pt="Selecionar documento" data-en="Select document">Selecionar documento</strong><input id="office-file" type="file" accept="{{ extensions }}" required></label><p>{{ extensions }}</p><p id="office-filename" class="picked-file"></p><button id="office-submit" class="primary-button" type="submit" data-pt="Converter para PDF" data-en="Convert to PDF" disabled>Converter para PDF</button></form><p id="office-message" role="status" aria-live="polite"></p><a id="office-download" class="download-button" hidden data-pt="Baixar PDF" data-en="Download PDF">Baixar PDF</a></section></main></body></html>
