<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fc"/>
      <stop offset="1" stop-color="#e9ebff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7458e8"/>
      <stop offset="1" stop-color="#563bd1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#202b4b" flood-opacity=".19"/>
    </filter>
    <clipPath id="hero-window"><rect x="505" y="58" width="700" height="476" rx="20"/></clipPath>
    <clipPath id="image-window"><rect x="650" y="348" width="365" height="248" rx="16"/></clipPath>
    <clipPath id="pdf-window"><rect x="858" y="382" width="365" height="248" rx="16"/></clipPath>
  </defs>
  <rect width="1280" height="640" rx="28" fill="url(#background)"/>
  <circle cx="100" cy="60" r="210" fill="#ffffff" opacity=".32"/>
  <circle cx="440" cy="620" r="220" fill="#dcd7ff" opacity=".34"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="76" y="90" width="58" height="58" rx="18" fill="url(#brand)"/>
    <path d="m91 119 10 10 19-22" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="152" y="128" fill="#171d34" font-size="25" font-weight="700">I Love Open Converter</text>

    <rect x="78" y="198" width="196" height="34" rx="17" fill="#eeebff"/>
    <circle cx="97" cy="215" r="5" fill="#6950dc"/>
    <text x="111" y="220" fill="#5a45bf" font-size="13" font-weight="700" letter-spacing="1">FREE · OPEN SOURCE</text>

    <text x="76" y="303" fill="#18203a" font-size="47" font-weight="750">PDF and image</text>
    <text x="76" y="360" fill="#18203a" font-size="47" font-weight="750">tools, self-hosted.</text>
    <text x="80" y="414" fill="#555f78" font-size="21">Simple file workflows on your own server.</text>

    <g transform="translate(80 478)">
      <rect width="142" height="38" rx="19" fill="#fff"/>
      <path d="M19 18h15M26.5 10.5v15" stroke="#6550d8" stroke-width="2.3" stroke-linecap="round"/>
      <text x="43" y="24" fill="#36405b" font-size="14" font-weight="600">PDF tools</text>
      <rect x="154" width="158" height="38" rx="19" fill="#fff"/>
      <rect x="173" y="11" width="17" height="15" rx="3" fill="none" stroke="#6550d8" stroke-width="2"/>
      <circle cx="186" cy="15" r="2" fill="#6550d8"/>
      <text x="199" y="24" fill="#36405b" font-size="14" font-weight="600">Image tools</text>
    </g>

    <rect x="493" y="47" width="724" height="494" rx="24" fill="#fff" filter="url(#shadow)"/>
    <g clip-path="url(#hero-window)">
      <image href="screenshots/home.jpg" x="505" y="58" width="700" height="476" preserveAspectRatio="xMidYMid slice"/>
    </g>
    <rect x="493" y="47" width="724" height="494" rx="24" fill="none" stroke="#fff" stroke-width="3"/>

    <rect x="638" y="337" width="389" height="270" rx="19" fill="#fff" filter="url(#shadow)"/>
    <g clip-path="url(#image-window)">
      <image href="screenshots/image-compress-result.jpg" x="650" y="348" width="365" height="248" preserveAspectRatio="xMidYMid slice"/>
    </g>
    <rect x="638" y="337" width="389" height="270" rx="19" fill="none" stroke="#fff" stroke-width="3"/>

    <rect x="846" y="371" width="389" height="270" rx="19" fill="#fff" filter="url(#shadow)"/>
    <g clip-path="url(#pdf-window)">
      <image href="screenshots/pdf-page-numbers-result.jpg" x="858" y="382" width="365" height="248" preserveAspectRatio="xMidYMid slice"/>
    </g>
    <rect x="846" y="371" width="389" height="270" rx="19" fill="none" stroke="#fff" stroke-width="3"/>
  </g>
</svg>
